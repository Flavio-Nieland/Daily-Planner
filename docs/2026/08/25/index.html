/* Broadsheet de 1978 sobre papel claro e discreto — ADR 0002.
   Papel claro não perdoa contraste baixo: tinta escura, réguas claras, vinheta quase nula.
   Tipografia de fontes já instaladas no Windows, sem webfont e sem CDN. */
:root{ --ink:#141209; --ink2:#514b3c; --rule:#c6bb9d; --accent:#8a2417; --desk:#1e1c19; --tex:.24 }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);display:flex;align-items:center;justify-content:center;
  padding:14px;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  font-family:"Century Schoolbook","Book Antiqua",Palatino,Georgia,serif}
h1,h2,h3,h4{margin:0;line-height:1.1;font-weight:700}
p{margin:0}

.folha{width:min(1000px,97vw);height:calc(100vh - 28px);max-height:920px;background:#fcf9f1;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  box-shadow:0 3px 6px rgba(0,0,0,.4),0 30px 70px -22px rgba(0,0,0,.85)}
.grao{position:absolute;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 64px rgba(110,88,40,.10),inset 0 0 220px rgba(110,88,40,.05)}
.grao::before{content:"";position:absolute;inset:0;background:var(--papel) center/cover;
  mix-blend-mode:multiply;opacity:var(--tex)}
.moldura{position:absolute;inset:12px;border:1.5px solid var(--ink);z-index:1;pointer-events:none}
.moldura::before{content:"";position:absolute;inset:4px;border:.5px solid rgba(20,18,9,.28)}
.folha>.dentro{position:relative;z-index:3;display:flex;flex-direction:column;height:100%;
  padding:14px clamp(18px,2.4vw,28px) 12px}

/* A cinta de status trocou o masthead: o nome do jornal ocupava um quinto da folha e
   não dizia nada que ele já não soubesse. Aqui vai o que muda todo dia — data, edição,
   folha N de M — e as bolinhas de navegação, numa faixa de uma linha. */
.cinta{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:rgba(20,18,9,.05);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 10px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);
  font-variant-numeric:tabular-nums}
.cinta .bolinhas{margin-left:auto;flex:0 0 auto;gap:7px}
.cinta .bolinha{width:11px;height:8px}

.cabeca{flex:0 0 auto;padding:11px 0 8px;text-align:center;border-bottom:3px double var(--ink)}
.cabeca .chapeu{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.cabeca h2{font-family:"Bodoni MT",Didot,Georgia,serif;font-size:clamp(26px,3vw,34px);
  margin-top:4px;letter-spacing:.02em;line-height:1}
.cabeca .cont{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:400;font-style:italic;margin-top:3px}

.corpo{flex:1 1 auto;min-height:0;overflow:hidden;column-count:3;column-gap:30px;
  column-rule:1px solid var(--ink);padding:14px 0 11px;font-size:var(--fs,13.5px);line-height:1.58;
  text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.corpo>*{margin-bottom:16px;break-inside:avoid}
@media(max-width:820px){.corpo{column-count:2}}

.rodape{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--ink);padding-top:7px}
.seta{background:none;border:0;cursor:pointer;padding:2px;line-height:0;color:var(--ink)}
.seta svg{width:42px;height:32px}
.seta:disabled{opacity:.18;cursor:default}
.bolinhas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.bolinha{width:14px;height:10px;border:1.5px solid var(--ink);border-radius:8px;background:none;
  cursor:pointer;padding:0}
.bolinha:hover{background:rgba(0,0,0,.12)}
.bolinha[aria-current="true"]{background:var(--ink)}
.numero{font-size:14px;font-style:italic;text-align:center;font-variant-numeric:tabular-nums}

/* blocos de conteúdo */
.bloco{text-align:left}
.bloco h4{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--rule);
  padding-bottom:3px;margin-bottom:5px}
.bloco .destaque{font-size:1.5em;font-variant-numeric:tabular-nums;line-height:1.15}
.bloco .miudo{font-size:.85em;color:var(--ink2);margin-top:2px}
.bloco.alerta{border-left:3px solid var(--accent);padding-left:11px}
.bloco.alerta h4{color:var(--accent);border-bottom-color:var(--accent)}
table.horas{width:100%;border-collapse:collapse;font-size:.86em;margin-top:6px;
  font-variant-numeric:tabular-nums}
table.horas td{padding:1px 0;border-bottom:1px solid var(--rule)}
table.horas td:nth-child(2),table.horas td:nth-child(3){text-align:right;padding-right:7px}
table.horas td:last-child{color:var(--ink2);font-size:.94em;text-align:right}
.sumario{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.sumario li{padding:.34em 0;border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:baseline}
.sumario b{font-variant-numeric:tabular-nums;min-width:1.6em}
.lede{font-size:1.15em;line-height:1.55;text-align:justify}
.capitular{float:left;font-weight:700;line-height:.78;padding:5px 8px 0 0;font-size:3.8em;
  font-family:"Bodoni MT",Georgia,serif}
.bloco.falhou{border:1.5px solid var(--accent);padding:9px 11px}
.bloco.falhou h4{color:var(--accent);border-bottom-color:var(--accent)}
.campo{display:flex;gap:7px;align-items:center;margin:6px 0 4px}
.campo input{font:inherit;font-size:1.3em;width:4.6em;padding:2px 6px;text-align:center;
  border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:inherit;
  font-variant-numeric:tabular-nums}
.campo input:focus{outline:none;background:rgba(20,18,9,.05)}
.campo button{font:inherit;font-size:.85em;letter-spacing:.12em;text-transform:uppercase;
  border:1.2px solid var(--ink);border-radius:4px;background:none;color:inherit;
  padding:4px 10px;cursor:pointer}
.campo button:hover{background:rgba(20,18,9,.08)}
.campo button:disabled{opacity:.4;cursor:default}
.curva{width:100%;height:auto;display:block;margin:4px 0 2px;color:var(--ink)}
.destaque-texto{font-size:1.25em;line-height:1.35;margin-top:2px}
.barra{height:7px;border:1.3px solid var(--ink);margin:6px 0 5px}
.barra i{display:block;height:100%;background:var(--ink)}
.feito{font-weight:700;letter-spacing:.06em}
.marcar{font:inherit;font-size:.85em;letter-spacing:.12em;text-transform:uppercase;
  border:1.2px solid var(--ink);border-radius:4px;background:none;color:inherit;
  padding:5px 12px;cursor:pointer}
.marcar:hover{background:rgba(20,18,9,.08)}
.marcar:disabled{opacity:.4;cursor:default}
.presc{border:1.5px solid var(--ink);padding:8px 10px}
.lances{font-family:"Courier New",monospace;font-size:.95em;line-height:1.5}

 sem registro</p><p class=\"destaque-texto\">—</p><p class=\"miudo\">primeira vez: anote a carga que você usou</p><p class=\"campo\"><input type=\"text\" inputmode=\"decimal\" class=\"carga-kg\" placeholder=\"kg\" aria-label=\"carga em quilos de Rosca direta com barra\"><input type=\"text\" inputmode=\"numeric\" class=\"carga-reps\" placeholder=\"reps\" aria-label=\"repetições de Rosca direta com barra\"><button type=\"button\" class=\"anotar-carga\" data-exercicio=\"rosca-direta-com-barra\" data-dia=\"2026-08-25\">anotar</button></p><p class=\"miudo aviso-carga\"></p></div>", "<div class=\"bloco exercicio\"><h4>Rosca martelo com halteres</h4><p class=\"miudo\">3 séries · 10-15 reps</p><p class=\"miudo\">última vez: sem registro</p><p class=\"destaque-texto\">—</p><p class=\"miudo\">primeira vez: anote a carga que você usou</p><p class=\"campo\"><input type=\"text\" inputmode=\"decimal\" class=\"carga-kg\" placeholder=\"kg\" aria-label=\"carga em quilos de Rosca martelo com halteres\"><input type=\"text\" inputmode=\"numeric\" class=\"carga-reps\" placeholder=\"reps\" aria-label=\"repetições de Rosca martelo com halteres\"><button type=\"button\" class=\"anotar-carga\" data-exercicio=\"rosca-martelo-com-halteres\" data-dia=\"2026-08-25\">anotar</button></p><p class=\"miudo aviso-carga\"></p></div>", "<div class=\"bloco\"><h4>Volume da semana</h4><p class=\"destaque\">0 kg</p><p class=\"miudo\">o volume aparece quando você começar a anotar</p></div>"], "falhou": false}, {"id": "programacao", "nome": "Programação", "chapeu": "Fundamentos que não expiram", "blocos": ["<div class=\"bloco\"><h4>Tópico 1 de 40</h4><p class=\"destaque-texto\">Fundamentos de lógica e conjuntos</p><p class=\"miudo\">pré-requisitos: nada — é ponto de partida</p></div>", "<div class=\"bloco\"><h4>Por que existe</h4><p>Programas precisam representar regras, condições e grupos de elementos sem depender das ambiguidades da linguagem comum. A lógica foi criada para avaliar afirmações e tirar conclusões válidas, enquanto a teoria dos conjuntos organiza objetos por pertencimento e relação. Juntos, esses fundamentos resolvem problemas de classificação, filtragem, comparação e combinação de informações.</p></div>", "<div class=\"bloco\"><h4>Implemente</h4><p>Comece do zero em Python, sem importar bibliotecas, criando dois conjuntos de números e usando operações de união, interseção e diferença. Depois, escreva condições com and, or e not para verificar se um número pertence a um conjunto e se atende a uma regra. Por fim, transforme o exercício em uma pequena lista de aprovados, mantendo apenas os elementos que pertencem ao conjunto correto e satisfazem a condição lógica.</p></div>", "<div class=\"bloco\"><h4>Antes · depois</h4><p><b>Antes:</b> Como este é o primeiro tópico, não há um conceito formal anterior: ele parte da observação de objetos, propriedades e relações no mundo. Essa observação deixa pronta a ideia de separar coisas, comparar características e fazer perguntas que possam receber verdadeiro ou falso.</p><p><b>Depois:</b> Isso leva à construção de algoritmos com decisões, filtros e validações, além de preparar o caminho para funções, estruturas de dados, bancos de dados e provas matemáticas. Também torna possível modelar problemas reais com regras precisas e operações sobre coleções.</p></div>", "<div class=\"bloco\"><h4>Na prática</h4><p>É por isso que uma consulta de banco de dados consegue filtrar, combinar e excluir registros usando condições lógicas e conjuntos.</p></div>", "<div class=\"bloco\"><h4>Concluiu?</h4><p class=\"campo\"><button type=\"button\" class=\"veredito\" data-veredito=\"concluido\" data-chave=\"cc:Fundamentos de lógica e conjuntos\" data-dia=\"2026-08-25\">concluí</button></p><p class=\"miudo\">libera: Provas matemáticas e invariantes, Análise de complexidade assintótica, Computabilidade e decidibilidade</p><p class=\"miudo\" id=\"programacao-aviso\">1 outro(s) tópico(s) já liberado(s).</p></div>"], "falhou": false}, {"id": "xadrez", "nome": "Xadrez", "chapeu": "Subindo de Elo", "blocos": ["<div class=\"bloco\"><h4>Trilha de hoje: abertura</h4><p class=\"destaque-texto\">Defesa Nimzo-Índia, variante Clássica</p><p class=\"miudo\">item 4 de 16 · amanhã a vez é de fundamentos</p></div>", "<div class=\"bloco\"><h4>Os lances</h4><p class=\"lances\">1.d4 Cf6 2.c4 e6 3.Cc3 Bb4 4.Dc2 O-O 5.a3 Bxc3+ 6.Dxc3 d5 7.Cf3 Cc6 8.Bg5 h6 9.Bh4</p></div>", "<div class=\"bloco\"><h4>A ideia</h4><p>As pretas trocam o bispo de b4 pelo cavalo de c3 para enfraquecer a estrutura branca e disputam o centro com ...d5, buscando desenvolvimento harmonioso e pressão sobre d4. A posição resultante favorece planos com ...Te8, ...e5 ou ...c5, enquanto as brancas tentam explorar o par de bispos e o espaço central.</p></div>", "<div class=\"bloco\"><h4>O erro comum</h4><p>O erro mais comum é entregar o bispo de b4 sem necessidade e permitir que as brancas consolidem o centro sem sofrer qualquer dano estrutural.</p></div>", "<div class=\"bloco presc\"><h4>Tática, no Chess.com</h4><p>Faça 20 puzzles no Chess.com puxando pelo tema de hoje. O treino de tática é lá — a folha só cobra.</p></div>", "<div class=\"bloco presc\"><h4>Análise, no Chess.com</h4><p>Abra sua última partida no analisador do Chess.com e ache o lance onde a vantagem virou. Um lance só, o primeiro que escorregou.</p></div>", "<div class=\"bloco\" id=\"elo-registro\"><h4>Seu Elo</h4><p class=\"destaque\">—</p><p class=\"campo\"><input type=\"text\" inputmode=\"numeric\" id=\"elo-valor\" placeholder=\"1240\" aria-label=\"Elo de hoje\" data-dia=\"2026-08-25\"><button type=\"button\" id=\"elo-gravar\">anotar</button></p><p class=\"miudo\" id=\"elo-aviso\">Anote depois de jogar; a curva entra na edição de amanhã.</p></div>", "<div class=\"bloco\"><p class=\"campo\"><button type=\"button\" class=\"marcar\" data-topico=\"xadrez\" data-dia=\"2026-08-25\" id=\"xadrez-marca\">fiz hoje</button></p><p class=\"miudo\" id=\"xadrez-aviso\">Marcar passa a vez para a outr ": 0, "blocos": [0, 1], "cont": 0}, {"topico": 1, "blocos": [0, 1, 2, 3], "cont": 0}, {"topico": 2, "blocos": [0, 1, 2, 3, 4, 5], "cont": 0}, {"topico": 2, "blocos": [6, 7, 8, 9, 10, 11], "cont": 0}, {"topico": 3, "blocos": [0, 1, 2], "cont": 0}, {"topico": 4, "blocos": [0, 1, 2], "cont": 0}, {"topico": 5, "blocos": [0, 1, 2], "cont": 0}, {"topico": 6, "blocos": [0, 1, 2, 3], "cont": 0}, {"topico": 7, "blocos": [0, 1, 2, 3, 4, 5, 6, 7], "cont": 0}, {"topico": 8, "blocos": [0, 1, 2, 3, 4, 5], "cont": 0}, {"topico": 9, "blocos": [0, 1, 2, 3, 4, 5, 6, 7], "cont": 0}, {"topico": 10, "blocos": [0, 1, 2, 3, 4], "cont": 0}]};

<script>
/* Paginação da edição — o MESMO código roda nos dois lados:
   no build, o Chromium headless chama window.__paginar() e o resultado é gravado no HTML;
   no cliente, a folha re-pagina ao abrir e ao redimensionar, porque a tela dele não é a do build.

   Armadilha do ADR 0001: multi-coluna transborda na HORIZONTAL. O teste é scrollWidth,
   não scrollHeight — medir altura não detecta nada e a paginação silenciosamente não acontece.

   Layout de 2026-08-21: o masthead saiu e a cabeça encolheu. Numa tela de notebook o
   cabeçalho antigo comia 210 dos 740 px da folha e o texto ficava com dois terços. Agora
   é uma cinta de status de uma linha, a cabeça centrada compacta, e o rodapé só com as
   setas. O auto-fit também parou de crescer até 18,6 px: inflava a folha inteira. */

const SETA_ESQ = '<svg viewBox="0 0 36 30"><path d="M14 6 L5 15 L14 24 M5 15 H31" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const SETA_DIR = '<svg viewBox="0 0 36 30"><path d="M22 6 L31 15 L22 24 M31 15 H5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

const TETO_FS = 15;                    // px; o corpo cresce até aqui, não mais

function transborda(el) { return el.scrollWidth > el.clientWidth + 2; }

function bolinhas(ativo) {
  return '<div class="bolinhas">' + EDICAO.topicos.map((t, i) =>
    '<button class="bolinha" data-topico="' + i + '" title="' + t.nome + '" aria-label="' + t.nome
    + '" aria-current="' + (i === ativo) + '"></button>').join('') + '</div>';
}

function cinta(indice, total, ti) {
  return '<div class="cinta"><span>' + EDICAO.dia + '</span><span>' + EDICAO.data + '</span>'
    + '<span>Edição ' + EDICAO.numero + '</span>'
    + '<span>Folha ' + (indice + 1) + ' de ' + total + '</span>'
    + bolinhas(ti) + '</div>';
}

function cabeca(topico, cont, chapeu) {
  return '<div class="cabeca"><div class="chapeu">' + (chapeu || topico.chapeu) + '</div>'
    + '<h2>' + topico.nome + '</h2>'
    + (cont > 0 ? '<span class="cont">continuação · folha ' + (cont + 1) + '</span>' : '')
    + '</div>';
}

/* Quebra obrigatória: bloco marcado com data-quebra abre folha nova e troca o chapéu.
   É assim que a Dieta sai sempre em duas — o dia numa folha, as compras dos 3 dias na outra. */
function quebras(topico) {
  const caixa = document.createElement('div');
  return topico.blocos.map(html => {
    caixa.innerHTML = html;
    const no = caixa.firstElementChild;
    return (no && no.dataset.quebra) || null;
  });
}

function chapeuDa(topico, primeiro) {
  const marcas = quebras(topico);
  let chapeu = topico.chapeu;
  for (let i = 0; i <= primeiro; i++) if (marcas[i]) chapeu = marcas[i];
  return chapeu;
}

/* Distribui os blocos de cada tópico em folhas, medindo numa folha invisível.
   Um bloco nunca é partido no meio: quando não cabe, vai inteiro para a folha seguinte. */
function __paginar() {
  const medidor = document.getElementById('medidor');
  medidor.innerHTML = '';
  const folha = document.createElement('div');
  folha.className = 'folha';
  const dentro = document.createElement('div');
  dentro.className = 'dentro';
  const topo = document.createElement('div');
  const cab = document.createElement('div');
  const corpo = document.createElement('div');
  corpo.className = 'corpo';
  const pe = document.createElement('div');
  pe.className = 'rodape';
  pe.style.height = '46px';
  dentro.append(topo, cab, corpo, pe);
  folha.appendChild(dentro);
  medidor.appendChild(folha);

  const folhas = [];
  EDICAO.topicos.forEach((topico, ti) => {
    const marcas = quebras(topico);
    let cont = 0, postos = 0;
    while (postos < topico.blocos.length) {
      if (marcas[postos]) cont = 0;              // grupo novo recomeça a contagem
      topo.innerHTML = cinta(0, 1, ti);          // na medição só a altura da cinta importa
      cab.innerHTML = cabeca(topico, cont, chapeuDa(topico, postos));
      corpo.innerHTML = '';
      const cabem = [];
      for (let i = postos; i < topico.blocos.length; i++) {
        if (marcas[i] && cabem.length) break;    // quebra obrigatória fecha a folha aqui
        const caixa = document.createElement('div');
        caixa.innerHTML = topico.blocos[i];
        const no = caixa.firstElementChild;
        corpo.appendChild(no);
        if (transborda(corpo)) {
          // bloco sozinho que não cabe fica assim mesmo — não dá para partir
          if (cabem.length === 0) cabem.push(i); else corpo.removeChild(no);
          break;
        }
        cabem.push(i);
      }
      folhas.push({ topico: ti, blocos: cabem.slice(), cont: cont });
      postos = cabem[cabem.length - 1] + 1;
      cont++;
    }
  });
  medidor.innerHTML = '';
  return folhas;
}

let FOLHAS = null, atual = 0;

function desenhar() {
  const f = FOLHAS[atual], topico = EDICAO.topicos[f.topico];
  const palco = document.getElementById('palco');

  const folha = document.createElement('div');
  folha.className = 'folha';
  const grao = document.createElement('div');
  grao.className = 'grao';
  const moldura = document.createElement('div');
  moldura.className = 'moldura';
  const dentro = document.createElement('div');
  dentro.className = 'dentro';
  dentro.innerHTML = cinta(atual, FOLHAS.length, f.topico)
    + cabeca(topico, f.cont, chapeuDa(topico, f.blocos[0]));

  const corpo = document.createElement('div');
  corpo.className = 'corpo';
  corpo.innerHTML = f.blocos.map(i => topico.blocos[i]).join('');
  dentro.appendChild(corpo);

  const pe = document.createElement('div');
  pe.className = 'rodape';
  pe.innerHTML = '<button class="seta" data-passo="-1"' + (atual === 0 ? ' disabled' : '') + '>' + SETA_ESQ + '</button>'
    + '<span class="numero">' + (atual + 1) + ' / ' + FOLHAS.length + '</span>'
    + '<button class="seta" data-passo="1"' + (atual === FOLHAS.length - 1 ? ' disabled' : '') + '>' + SETA_DIR + '</button>';
  dentro.appendChild(pe);

  folha.append(grao, moldura, dentro);
  palco.innerHTML = '';
  palco.appendChild(folha);

  // colunas adaptativas: folha com pouco conteúdo não merece 3 colunas.
  // A paginação foi medida em 3 colunas, então 2 colunas pode não caber — daí a volta atrás.
  corpo.style.columnCount = 2;
  if (transborda(corpo)) corpo.style.columnCount = 3;
  // auto-fit tipográfico: o corpo cresce até quase estourar, com teto — texto de jornal,
  // não cartaz. Passar de 15 px fazia a folha de duas linhas parecer aviso de porta.
  let fs = 13.5;
  corpo.style.setProperty('--fs', fs + 'px');
  while (fs < TETO_FS) {
    const passo = +(fs + 0.4).toFixed(2);
    corpo.style.setProperty('--fs', passo + 'px');
    if (transborda(corpo)) { corpo.style.setProperty('--fs', fs + 'px'); break; }
    fs = passo;
  }

  // as bolinhas moraram no rodapé até 2026-08-21; agora estão na cinta, então o clique
  // é ouvido na folha inteira
  dentro.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.passo) ir(atual + (+b.dataset.passo));
    if (b.dataset.topico !== undefined) ir(FOLHAS.findIndex(x => x.topico === +b.dataset.topico));
  });
}

function ir(i) {
  if (i < 0 || i >= FOLHAS.length || i === atual) return;
  atual = i;
  desenhar();
}

function abrir() {
  // as folhas do build servem de primeira leitura; a medição local manda, porque a tela muda
  FOLHAS = __paginar();
  if (atual >= FOLHAS.length) atual = FOLHAS.length - 1;
  desenhar();
}

if (typeof window !== 'undefined') {
  window.__paginar = __paginar;
  window.addEventListener('DOMContentLoaded', () => {
    FOLHAS = EDICAO.folhas && EDICAO.folhas.length ? EDICAO.folhas : __paginar();
    desenhar();
    requestAnimationFrame(abrir);          // confere a medição na tela real
  });
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(abrir, 180); });
  window.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') ir(atual - 1);
    if (ev.key === 'ArrowRight') ir(atual + 1);
  });
}

/* O registro do peso: manda para o Worker e confirma na própria folha, sem recarregar.

   O token é dele e fica no localStorage do navegador — o HTML publicado é público e nunca
   carrega credencial. A curva do jornal só muda amanhã, porque a edição de hoje já está
   publicada; a folha diz isso em vez de fingir que atualizou. */

const GUARDA_TOKEN = "diario.token";

async function gravarNoWorker(secao, chave, valor) {
  if (!EDICAO.worker) throw new Error("o Worker ainda não foi configurado nesta edição");
  let token = localStorage.getItem(GUARDA_TOKEN);
  if (!token) {
    token = (prompt("Cole o token do seu Worker (fica salvo neste navegador):") || "").trim();
    if (!token) throw new Error("sem token, nada é gravado");
    localStorage.setItem(GUARDA_TOKEN, token);
  }
  const resposta = await fetch(EDICAO.worker + "/estado", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ secao, chave, valor }),
  });
  if (resposta.status === 401) {
    localStorage.removeItem(GUARDA_TOKEN);
    throw new Error("token recusado — tente de novo para digitar outro");
  }
  if (!resposta.ok) throw new Error("o Worker respondeu " + resposta.status);
  return resposta.json();
}

document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest("#peso-gravar");
  if (!botao) return;
  const campo = document.getElementById("peso-valor");
  const aviso = document.getElementById("peso-aviso");
  const kg = parseFloat((campo.value || "").replace(",", "."));
  if (!isFinite(kg) || kg <= 0 || kg > 400) {
    aviso.textContent = "Peso inválido.";
    return;
  }
  botao.disabled = true;
  aviso.textContent = "gravando…";
  try {
    await gravarNoWorker("peso", campo.dataset.dia, kg);
    aviso.textContent = `${kg.toFixed(1)} kg gravado. Entra na curva na edição de amanhã.`;
    campo.value = "";
  } catch (erro) {
    aviso.textContent = "Não gravou: " + erro.message;
  } finally {
    botao.disabled = false;
  }
});

/* Marcar um tópico como feito. É isto que avança o plano — nunca o calendário.
   O navegador só registra o dia; quem decide a sessão da vez é o build. */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest(".marcar");
  if (!botao) return;
  const topico = botao.dataset.topico;
  const aviso = document.getElementById(topico + "-aviso");
  botao.disabled = true;
  if (aviso) aviso.textContent = "marcando…";
  try {
    await gravarNoWorker("feito", topico + ":" + botao.dataset.dia, true);
    botao.outerHTML = '<span class="feito">✓ feito hoje</span>';
    if (aviso) aviso.textContent = "Avança na edição de amanhã.";
  } catch (erro) {
    botao.disabled = false;
    if (aviso) aviso.textContent = "Não marcou: " + erro.message;
  }
});

/* Elo: mesma mecânica do peso, seção diferente. */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest("#elo-gravar");
  if (!botao) return;
  const campo = document.getElementById("elo-valor");
  const aviso = document.getElementById("elo-aviso");

  } catch (erro) {
    aviso.textContent = "Não gravou: " + erro.message;
  } finally {
    botao.disabled = false;
  }
});

/* Comida: o veredito guarda o prato e o dia numa gravação só. */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest(".veredito");
  if (!botao) return;
  const aviso = document.getElementById("comida-aviso")
             || document.getElementById("programacao-aviso");
  document.querySelectorAll(".veredito").forEach(b => (b.disabled = true));
  aviso.textContent = "gravando…";
  try {
    const chave = botao.dataset.chave || "prato:" + botao.dataset.prato;
    await gravarNoWorker("dominio", chave,
      { dia: botao.dataset.dia, veredito: botao.dataset.veredito });
    aviso.textContent = { dominado: "Marcado como dominado. Amanhã vem o próximo prato.",
                          revisar: "Anotado. O prato volta para revisão em alguns dias.",
                          concluido: "Concluído. Amanhã entra o próximo tópico liberado." }[botao.dataset.veredito]
                        || "Anotado.";
  } catch (erro) {
    document.querySelectorAll(".veredito").forEach(b => (b.disabled = false));
    aviso.textContent = "Não gravou: " + erro.message;
  }
});

/* Álbum: o estilo pedido vale a partir da edição de amanhã. */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest("#estilo-gravar");
  if (!botao) return;
  const campo = document.getElementById("estilo-valor");
  const aviso = document.getElementById("estilo-aviso");
  const estilo = (campo.value || "").trim();

    aviso.textContent = "Escreva um estilo.";

  }
  botao.disabled = true;
  aviso.textContent = "gravando…";

    await gravarNoWorker("estilo", "pedido", { dia: campo.dataset.dia, estilo });
    aviso.textContent = `"${estilo}" anotado. A sugestão muda na edição de amanhã.`;
    campo.value = "";
  } catch (erro) {
    aviso.textContent = "Não gravou: " + erro.message;
  } finally {
    botao.disabled = false;
  }
});

/* Alongamento: mão–chão em cm e dor de 0 a 10, na mesma seção "medida". */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest(".medir");
  if (!botao) return;
  const qual = botao.dataset.medida;
  const campo = document.getElementById(qual + "-valor");
  const aviso = document.getElementById("medida-aviso");

    aviso.textContent = "Anotado. Entra na comparação amanhã.";

  } catch (erro) {
    aviso.textContent = "Não gravou: " + erro.message;
  } finally {

  }

/* Treino: carga e reps por exercício, numa gravação só. */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest(".anotar-carga");
  if (!botao) return;
  const bloco = botao.closest(".exercicio");
  const aviso = bloco.querySelector(".aviso-carga");
  const kg = parseFloat((bloco.querySelector(".carga-kg").value || "").replace(",", "."));
  const reps = parseInt(bloco.querySelector(".carga-reps").value, 10);
  if (!isFinite(kg) || kg <= 0 || kg > 700 || !isFinite(reps) || reps <= 0 || reps > 100) {
    aviso.textContent = "Carga ou reps inválidos.";
    return;
  }
  botao.disabled = true;
  aviso.textContent = "gravando…";
  try {
    await gravarNoWorker("carga", botao.dataset.exercicio + ":" + botao.dataset.dia, { kg, reps });
    aviso.textContent = `${kg} kg × ${reps} anotado.`;
  } catch (erro) {
    botao.disabled = false;
    aviso.textContent = "Não gravou: " + erro.message;
  }
});

/* Livros: o que ele escreve é o dado mais valioso do sistema — vai para o Worker na hora. */
document.addEventListener("click", async (ev) => {
  const botao = ev.target.closest("#nota-gravar");
  if (!botao) return;
  const campo = document.getElementById("nota-valor");
  const aviso = document.getElementById("nota-aviso");
  const texto = (campo.value || "").trim();
  if (texto.length < 3) {
    aviso.textContent = "Escreva sua resposta antes de anotar.";
    return;
  }
  botao.disabled = true;
  aviso.textContent = "gravando…";
  try {
    await gravarNoWorker("nota", campo.dataset.dia, texto);
    aviso.textContent = "Anotado. Volta para revisão em três semanas.";
  } catch (erro) {
    botao.disabled = false;
    aviso.textContent = "Não gravou: " + erro.message;
  }
});

/* Inglês, trilha da fala: o navegador lê a expressão em voz alta. Sempre funciona,
   offline e sem custo — para ouvir-e-repetir basta, e é o que o tópico precisa aqui. */
document.addEventListener("click", (ev) => {
  const frase = ev.target.closest("[data-falar]");
  if (!frase || !window.speechSynthesis) return;
  const fala = new SpeechSynthesisUtterance(frase.dataset.falar);
  fala.lang = "en-US";
  fala.rate = 0.95;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(fala);
});
